<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .ui { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; fill: #11243f; }
      .label { font-size: 14px; font-weight: 800; letter-spacing: .14em; fill: #e95445; }
      .card-title { font-size: 22px; font-weight: 850; }
      .card-copy { font-size: 14px; font-weight: 600; fill: #5d6b7f; }
      .category { font-size: 13px; font-weight: 800; fill: #e95445; }
    </style>
    <clipPath id="stageClip"><rect width="670" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#stageClip)">
    <image href="scene-background.svg" x="0" y="0" width="670" height="900" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="670" height="900" fill="#eaf5fb" opacity=".13"/>
    <image href="outfit-composite.svg" x="60" y="64" width="550" height="825"/>
  </g>

  <g class="ui">
    <rect x="22" y="22" width="626" height="82" rx="8" fill="#f8fbfd" stroke="#11243f" stroke-width="4"/>
    <rect x="28" y="98" width="626" height="8" fill="#11243f"/>
    <circle cx="66" cy="63" r="22" fill="#ffc83d"/>
    <path d="M66 45 L71 57 L84 58 L74 67 L77 80 L66 73 L55 80 L58 67 L48 58 L61 57 Z" fill="#11243f"/>
    <text x="102" y="57" font-size="21" font-weight="850">맑은 오후 · 구조대 훈련장</text>
    <text x="102" y="82" font-size="14" font-weight="650" fill="#5d6b7f">빠르게 움직이고 다른 사람에게 잘 보여야 해요</text>
  </g>

  <rect x="670" y="0" width="930" height="900" fill="#fbf7ef"/>
  <g class="ui">
    <text class="label" x="720" y="54">WARDROBE</text>
    <text x="720" y="102" font-size="34" font-weight="850">구조 훈련 코디 완성</text>
    <text x="1528" y="74" text-anchor="end" font-size="16" font-weight="800" fill="#e95445">모두 벗기</text>

    <g transform="translate(720 126)">
      <rect width="820" height="52" rx="6" fill="#ffffff" stroke="#11243f" stroke-width="2"/>
      <path d="M205 0 V52 M410 0 V52 M615 0 V52" stroke="#d1d7df" stroke-width="2"/>
      <g font-size="16" font-weight="850" text-anchor="middle">
        <text x="102" y="33">상의 ✓</text>
        <text x="307" y="33">하의 ✓</text>
        <text x="512" y="33">신발 ✓</text>
        <text x="717" y="33">소품 ✓</text>
      </g>
    </g>

    <g transform="translate(720 198)">
      <rect width="390" height="252" rx="12" fill="#ffffff" stroke="#f26455" stroke-width="4"/>
      <image href="card-rescue-top.svg" x="14" y="14" width="362" height="143" preserveAspectRatio="xMidYMid slice"/>
      <text class="category" x="18" y="181">상의</text>
      <text class="card-title" x="18" y="210">구조 훈련복</text>
      <text class="card-copy" x="18" y="235">밝은 색과 반사 띠로 잘 보여요.</text>
    </g>

    <g transform="translate(1150 198)">
      <rect width="390" height="252" rx="12" fill="#ffffff" stroke="#f26455" stroke-width="4"/>
      <image href="card-activity-pants.svg" x="14" y="14" width="362" height="143" preserveAspectRatio="xMidYMid slice"/>
      <text class="category" x="18" y="181">하의</text>
      <text class="card-title" x="18" y="210">활동 바지</text>
      <text class="card-copy" x="18" y="235">움직이기 쉽고 무릎을 보호해요.</text>
    </g>

    <g transform="translate(720 480)">
      <rect width="390" height="252" rx="12" fill="#ffffff" stroke="#f26455" stroke-width="4"/>
      <image href="card-grip-sneakers.svg" x="14" y="14" width="362" height="143" preserveAspectRatio="xMidYMid slice"/>
      <text class="category" x="18" y="181">신발</text>
      <text class="card-title" x="18" y="210">논슬립 운동화</text>
      <text class="card-copy" x="18" y="235">미끄러지지 않고 빠르게 움직여요.</text>
    </g>

    <g transform="translate(1150 480)">
      <rect width="390" height="252" rx="12" fill="#ffffff" stroke="#f26455" stroke-width="4"/>
      <image href="card-safety-helmet.svg" x="14" y="14" width="362" height="143" preserveAspectRatio="xMidYMid slice"/>
      <text class="category" x="18" y="181">소품</text>
      <text class="card-title" x="18" y="210">안전모</text>
      <text class="card-copy" x="18" y="235">머리를 보호하고 밝아서 잘 보여요.</text>
    </g>

    <rect x="670" y="772" width="930" height="128" fill="#ffffff" stroke="#11243f" stroke-width="3"/>
    <text x="720" y="816" font-size="14" font-weight="750" fill="#5d6b7f">선택한 아이템</text>
    <text x="720" y="856" font-size="27" font-weight="900">4 / 4</text>
    <text x="927" y="838" font-size="15" font-weight="750" fill="#5d6b7f">안전 40 · 활동 35 · 가시성 25</text>
    <rect x="1282" y="798" width="258" height="72" rx="12" fill="#f26455"/>
    <rect x="1282" y="858" width="258" height="12" rx="6" fill="#c94137"/>
    <text x="1411" y="843" text-anchor="middle" font-size="20" font-weight="900" fill="#ffffff">이 코디로 출발! →</text>
  </g>
</svg>
